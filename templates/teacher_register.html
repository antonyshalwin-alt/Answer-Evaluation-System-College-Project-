<!DOCTYPE html>
<html>
<head lang="en">
    <meta charset="UTF-8">
    <title>AES_ai - Teacher Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,300,600,700,800' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" type="text/css" href="{{url_for('static',filename='style.css')}}"/>
    <link rel="stylesheet" type="text/css" href="{{url_for('static',filename='namari-color.css')}}"/>
    <link rel="stylesheet" type="text/css" href="{{url_for('static',filename='font-awesome.min.css')}}"/>
    <link rel="stylesheet" type="text/css" href="{{url_for('static',filename='animate.css')}}"/>
</head>
<body>

<div id="wrapper">
    <header id="banner" class="scrollto clearfix" data-enllax-ratio=".5">
        <div id="header" class="nav-collapse">
            <div class="row clearfix">
                <div class="col-1">
                    <div id="logo">
                        <img src="{{url_for('static',filename='images/logo1animate.gif')}}" id="banner-logo" alt="Logo"/>
                        <img src="{{url_for('static',filename='images/logo1animate.gif')}}" id="navigation-logo" alt="Logo"/>
                    </div>
                    <nav id="nav-main">
                        <ul>
                            <li><a href="{{ url_for('index') }}">Home</a></li>
                            <li><a href="{{ url_for('teacher_login') }}">Login</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="container">

                <div class="forms">
                    <div class="form-content">
                        <div class="login-form">
                            <div class="title">Teacher Registration</div>

                            <form action="{{ url_for('teacher_register') }}" method="POST">
                                <div class="input-boxes">

                                    <div class="input-box">
                                        <i class="fas fa-user"></i>
                                        <input type="text" name="name" placeholder="Full Name" required>
                                    </div>

                                    <div class="input-box">
                                        <i class="fas fa-venus-mars"></i>
                                        <select name="gender" required>
                                            <option value="" disabled selected>Select Gender</option>
                                            <option value="Male">Male</option>
                                            <option value="Female">Female</option>
<!--                                            <option value="Other">Other</option>-->
                                        </select>
                                    </div>

                                    <div class="input-box">
                                        <i class="fas fa-phone"></i>
                                        <input type="text" name="phone" placeholder="Phone Number" required>
                                    </div>

                                    <div class="input-box">
                                        <i class="fas fa-map-marker-alt"></i>
                                        <input type="text" name="address" placeholder="Address" required>
                                    </div>

                                    <div class="input-box">
                                        <i class="fas fa-university"></i>
                                        <input type="text" name="department" placeholder="Department (e.g. CSE)" required>
                                    </div>

                                    <div class="input-box">
                                        <i class="fas fa-envelope"></i>
                                        <input type="email" name="email" placeholder="Email Address" required>
                                    </div>

                                    <div class="input-box">
                                        <i class="fas fa-lock"></i>
                                        <input type="password" name="password" placeholder="Create Password" required>
                                    </div>

                                    <button type="submit" class="button-64" style="margin-top: 20px; width: 100%;">
                                        <span class="text">Register</span>
                                    </button>

                                    <div class="text login-text">Already have an account? <a href="{{ url_for('teacher_login') }}">Login now</a></div>
                                </div>
                            </form>

                            {% if error %}
                            <div class="alert alert-danger" style="color: red; margin-top: 15px; text-align: center;">
                                {{ error }}
                            </div>
                            {% endif %}

                        </div>
                    </div>
                </div>
            </div>
        </div>

    </header>
</div>

<script src="{{url_for('static',filename='js/jquery.1.8.3.min.js')}}"></script>
<script src="{{url_for('static',filename='js/site.js')}}"></script>

</body>

<style>
/* Reused styles for consistency */
.button-64 {
  align-items: center;
  background-image: linear-gradient(144deg,#AF40FF, #5B42F3 50%,#00DDEB);
  border: 0;
  border-radius: 8px;
  box-shadow: rgba(254, 254, 255, 0.2) 0 15px 30px -5px;
  box-sizing: border-box;
  color: #FFFFFF;
  display: flex;
  font-family: Phantomsans, sans-serif;
  font-size: 20px;
  justify-content: center;
  line-height: 1em;
  padding: 3px;
  text-decoration: none;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
  cursor: pointer;
}

.button-64 span {
  background-color: rgb(5, 6, 45);
  padding: 16px 24px;
  border-radius: 6px;
  width: 100%;
  height: 100%;
  transition: 300ms;
}

.button-64:hover span {
  background: none;
}

.card{
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
}

.container{
  position: relative;
  max-width: 900px; /* Matched width with student form */
  width: 100%;
  background: #fff;
  padding: 40px 30px;
  box-shadow: 0 5px 10px rgba(0,0,0,0.2);
}

.container .cover{
  position: absolute;
  top: 0;
  left: 50%;
  height: 100%;
  width: 50%;
  z-index: 98;
  transition: all 1s ease;
  transform-origin: left;
  transform-style: preserve-3d;
}

.container .cover .front{
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  width: 100%;
}

.container .cover img{
  position: absolute;
  height: 100%;
  width: 100%;
  object-fit: cover;
  z-index: 10;
}

.container .cover .text{
  position: absolute;
  z-index: 130;
  height: 100%;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.cover .text .text-1, .cover .text .text-2{
  font-size: 26px;
  font-weight: 600;
  color: #fff;
  text-align: center;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
}

.cover .text .text-2{
  font-size: 15px;
  font-weight: 500;
}

.container .forms{
  height: 100%;
  width: 100%;
  background: #fff;
}

.container .form-content{
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.form-content .login-form{
  width: 100%;
}

/* Scrollable form logic */
.input-boxes {
    max-height: 600px;
    overflow-y: auto;
    padding-right: 5px;
}

.input-boxes::-webkit-scrollbar { width: 5px; }
.input-boxes::-webkit-scrollbar-track { background: #f1f1f1; }
.input-boxes::-webkit-scrollbar-thumb { background: #888; }
.input-boxes::-webkit-scrollbar-thumb:hover { background: #555; }

.forms .form-content .title{
  position: relative;
  font-size: 24px;
  font-weight: 500;
  color: #333;
}

.forms .form-content .title:before{
  content: '';
  position: absolute;
  left: 0;
  bottom: 0;
  height: 3px;
  width: 25px;
  background: #7d2ae8;
}

.forms .form-content .input-box{
  display: flex;
  align-items: center;
  height: 40px;
  width: 100%;
  margin: 15px 0;
  position: relative;
}

/* Styled select to match input */
.form-content .input-box input,
.form-content .input-box select {
  height: 100%;
  width: 100%;
  outline: none;
  border: none;
  padding: 0 30px;
  font-size: 16px;
  font-weight: 500;
  border-bottom: 2px solid rgba(0,0,0,0.2);
  transition: all 0.3s ease;
  background: transparent;
  color: #333;
}

.form-content .input-box input:focus,
.form-content .input-box input:valid,
.form-content .input-box select:focus {
  border-color: #7d2ae8;
}

.form-content .input-box i{
  position: absolute;
  color: #7d2ae8;
  font-size: 17px;
}

.forms .form-content .text{
  font-size: 14px;
  font-weight: 500;
  color: #333;
}

.forms .form-content .text a{
  text-decoration: none;
  color: #5b13b9;
}

.forms .form-content .text a:hover{
  text-decoration: underline;
}

.forms .form-content .login-text{
  text-align: center;
  margin-top: 25px;
}

@media (max-width: 730px) {
  .container .cover{
    display: none;
  }
}
</style>
</html>
