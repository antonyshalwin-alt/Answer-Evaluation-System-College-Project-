<!DOCTYPE html>
<html>
<head lang="en">
    <meta charset="UTF-8">
    <title>AES_ai - Student Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,300,600,700,800' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" type="text/css" href="{{url_for('static',filename='style.css')}}"/>
    <link rel="stylesheet" type="text/css" href="{{url_for('static',filename='namari-color.css')}}"/>
    <link rel="stylesheet" type="text/css" href="{{url_for('static',filename='font-awesome.min.css')}}"/>
    <link rel="stylesheet" type="text/css" href="{{url_for('static',filename='animate.css')}}"/>
</head>
<body>

<div id="wrapper">
    <header id="banner" class="scrollto clearfix" data-enllax-ratio=".5">
        <div id="header" class="nav-collapse">
            <div class="row clearfix">
                <div class="col-1">
                    <div id="logo">
                        <img src="{{url_for('static',filename='images/logo1animate.gif')}}" id="banner-logo" alt="Landing Page"/>
                        <img src="{{url_for('static',filename='images/logo1animate.gif')}}" id="navigation-logo" alt="Landing Page"/>
                    </div>

                    <nav id="nav-main">
                        <ul>
                            <li><a href="{{ url_for('index') }}">Home</a></li>
                            <li><a href="{{ url_for('student_login') }}">Student</a></li>
                            <li><a href="{{ url_for('teacher_login') }}">Teacher</a></li>
                            <li><a href="{{ url_for('admin_login') }}">Admin</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="container">

                <div class="forms">
                    <div class="form-content">
                        <div class="login-form">
                            <div class="title">Student Login</div>

                            <form action="{{ url_for('student_login') }}" method="POST">
                                <div class="input-boxes">
                                    <div class="input-box">
                                        <i class="fas fa-envelope"></i>
                                        <input type="email" name="email" placeholder="Enter your email" required>
                                    </div>
                                    <div class="input-box">
                                        <i class="fas fa-lock"></i>
                                        <input type="password" name="password" placeholder="Enter your password" required>
                                    </div>

                                    <button type="submit" class="button-64" style="margin-top: 20px; width: 100%;">
                                        <span class="text">Login</span>
                                    </button>

                                    <div class="text login-text">Don't have an account? <a href="{{ url_for('student_register') }}">Signup now</a></div>
                                </div>
                            </form>

                            {% if error %}
                            <div class="alert alert-danger" style="color: red; margin-top: 15px; text-align: center;">
                                {{ error }}
                            </div>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>
</div>

<script src="{{url_for('static',filename='js/jquery.1.8.3.min.js')}}"></script>
<script src="{{url_for('static',filename='js/site.js')}}"></script>

</body>
<style>
/* ... (Keep your existing CSS exactly as it was) ... */

</style>
</html>
</html>
