<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Home</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="{{ url_for('teacher_home') }}">Teacher Panel</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item active">
                    <a class="nav-link" href="{{ url_for('teacher_home') }}">Home <span class="sr-only">(current)</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('teacher_view_score') }}">Score</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('teacher_profile') }}">Profile</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('teacher_logout') }}">Logout</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h2 class="mt-5">Welcome, Teacher!</h2>

        <form method="POST" action="{{ url_for('teacher_home') }}" class="mt-4 mb-3">
            <div class="form-row align-items-center">

                <div class="col-md-6 my-1">
                    <input type="text" name="test_name" class="form-control" placeholder="Enter Test Name" required>
                </div>

                <div class="col-md-3 my-1">
                    <select class="custom-select mr-sm-2" name="test_class" required>
                        <option value="" selected disabled>Select Class...</option>
                        <option value="+2">+2</option>
                        <option value="+1">+1</option>
                        <option value="10">10</option>
                        <option value="9">9</option>
                        <option value="8">8</option>
                        <option value="7">7</option>
                        <option value="6">6</option>
                        <option value="5">5</option>
                        <option value="4">4</option>
                        <option value="3">3</option>
                        <option value="2">2</option>
                        <option value="1">1</option>
                    </select>
                </div>

                <div class="col-md-3 my-1">
                    <button type="submit" name="add_test_name" class="btn btn-primary btn-block">Create Test</button>
                </div>
            </div>
        </form>

        <hr>

        <h3 class="mt-4">Your Tests:</h3>

        <ul class="list-group bg-dark">
            {% for test in tests %}
                <li class="list-group-item d-flex justify-content-between align-items-center bg-dark text-white">
                    <div>
                        <a href="{{ url_for('view_teacher_test_questions', test_id=test[0]) }}" class="text-white font-weight-bold" style="font-size: 1.1rem;">
                            {{ test[1] }}
                        </a>
                        <span class="badge badge-warning ml-2">{{ test[3] if test[3] else 'All' }}</span>
                    </div>

                    <div class="btn-group">
                        <button type="button" class="btn btn-info btn-sm" data-toggle="modal" data-target="#editTestModal{{ test[0] }}">Edit</button>
                        <form method="POST" action="{{ url_for('teacher_home') }}" class="ml-1">
                            <input type="hidden" name="test_id" value="{{ test[0] }}">
                            <button type="submit" name="delete_test_name" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this test?');">Delete</button>
                        </form>
                    </div>
                </li>

                <div class="modal fade" id="editTestModal{{ test[0] }}" tabindex="-1" role="dialog" aria-labelledby="editTestModalLabel{{ test[0] }}" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content bg-dark text-white">
                            <div class="modal-header border-secondary">
                                <h5 class="modal-title" id="editTestModalLabel{{ test[0] }}">Edit Test</h5>
                                <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div>
                            <div class="modal-body">
                                <form method="POST" action="{{ url_for('teacher_home') }}">
                                    <input type="hidden" name="test_id" value="{{ test[0] }}">

                                    <div class="form-group">
                                        <label>Test Name</label>
                                        <input type="text" name="updated_test_name" class="form-control bg-secondary text-white border-0" value="{{ test[1] }}" required>
                                    </div>

                                    <div class="form-group">
                                        <label>Target Class</label>
                                        <select class="form-control bg-secondary text-white border-0" name="updated_test_class">
                                            <option value="{{ test[3] }}" selected>{{ test[3] if test[3] else 'Current Class' }}</option>
                                            <option value="+2">+2</option>
                                            <option value="+1">+1</option>
                                            <option value="10">10</option>
                                            <option value="9">9</option>
                                            <option value="8">8</option>
                                            <option value="7">7</option>
                                            <option value="6">6</option>
                                            <option value="5">5</option>
                                            <option value="4">4</option>
                                            <option value="3">3</option>
                                            <option value="2">2</option>
                                            <option value="1">1</option>
                                        </select>
                                    </div>

                                    <button type="submit" name="update_test_name" class="btn btn-primary btn-block">Save Changes</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </ul>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
