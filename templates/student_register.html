<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AES_ai - Student Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,300,600,700,800' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" type="text/css" href="{{url_for('static',filename='style.css')}}"/>
    <link rel="stylesheet" type="text/css" href="{{url_for('static',filename='namari-color.css')}}"/>
    <link rel="stylesheet" type="text/css" href="{{url_for('static',filename='font-awesome.min.css')}}"/>
    <link rel="stylesheet" type="text/css" href="{{url_for('static',filename='animate.css')}}"/>

    <style>
        /* CSS moved to Head for valid HTML structure */
        .button-64 {
          align-items: center;
          background-image: linear-gradient(144deg,#AF40FF, #5B42F3 50%,#00DDEB);
          border: 0;
          border-radius: 8px;
          box-shadow: rgba(254, 254, 255, 0.2) 0 15px 30px -5px;
          box-sizing: border-box;
          color: #FFFFFF;
          display: flex;
          font-family: Phantomsans, sans-serif;
          font-size: 20px;
          justify-content: center;
          line-height: 1em;
          padding: 3px;
          text-decoration: none;
          user-select: none;
          -webkit-user-select: none;
          touch-action: manipulation;
          white-space: nowrap;
          cursor: pointer;
        }

        .button-64 span {
          background-color: rgb(5, 6, 45);
          padding: 16px 24px;
          border-radius: 6px;
          width: 100%;
          height: 100%;
          transition: 300ms;
        }

        .button-64:hover span {
          background: none;
        }

        .card{
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 30px;
        }

        .container{
          position: relative;
          max-width: 900px;
          width: 100%;
          background: #fff;
          padding: 40px 30px;
          box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        }

        .container .forms{
          height: 100%;
          width: 100%;
          background: #fff;
        }

        .container .form-content{
          display: flex;
          align-items: center;
          justify-content: space-between;
        }

        .form-content .login-form{
          width: 100%;
        }

        .forms .form-content .title{
          position: relative;
          font-size: 24px;
          font-weight: 500;
          color: #333;
          margin-bottom: 20px;
        }

        .forms .form-content .title:before{
          content: '';
          position: absolute;
          left: 0;
          bottom: -5px;
          height: 3px;
          width: 25px;
          background: #7d2ae8;
        }

        .input-boxes {
            width: 100%;
        }

        .input-box{
          display: flex;
          align-items: center;
          height: 50px;
          width: 100%;
          margin: 15px 0;
          position: relative;
        }

        .input-box input,
        .input-box select {
          height: 100%;
          width: 100%;
          outline: none;
          border: none;
          padding: 0 30px 0 45px; /* Added left padding for icon */
          font-size: 16px;
          font-weight: 500;
          border-bottom: 2px solid rgba(0,0,0,0.2);
          transition: all 0.3s ease;
          background: transparent;
          color: #333;
        }

        .input-box input:focus,
        .input-box input:valid,
        .input-box select:focus {
          border-color: #7d2ae8;
        }

        .input-box i{
          position: absolute;
          left: 10px; /* Positioning icon inside the box */
          color: #7d2ae8;
          font-size: 17px;
        }

        .text.login-text{
          text-align: center;
          margin-top: 25px;
          color: #333;
        }

        .text.login-text a{
          text-decoration: none;
          color: #5b13b9;
        }

        .text.login-text a:hover{
          text-decoration: underline;
        }
    </style>
</head>
<body>

<div id="wrapper">
    <header id="banner" class="scrollto clearfix" data-enllax-ratio=".5">
        <div id="header" class="nav-collapse">
            <div class="row clearfix">
                <div class="col-1">
                    <div id="logo">
                        <img src="{{url_for('static',filename='images/logo1animate.gif')}}" id="banner-logo" alt="Logo"/>
                        <img src="{{url_for('static',filename='images/logo1animate.gif')}}" id="navigation-logo" alt="Logo"/>
                    </div>
                    <nav id="nav-main">
                        <ul>
                            <li><a href="{{ url_for('index') }}">Home</a></li>
                            <li><a href="{{ url_for('student_login') }}">Login</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="container">
                <div class="forms">
                    <div class="form-content">
                        <div class="login-form">
                            <div class="title">Student Registration</div>

                            <form action="{{ url_for('student_register') }}" method="POST">
                                <div class="input-boxes">

                                    <div class="input-box">
                                        <i class="fas fa-user"></i>
                                        <input type="text" name="name" placeholder="Full Name" required>
                                    </div>

                                    <div class="input-box">
                                        <i class="fas fa-calendar-alt"></i>
                                        <input type="number" name="age" placeholder="Age" required>
                                    </div>

                                    <div class="input-box">
                                        <i class="fas fa-venus-mars"></i>
                                        <select name="gender" required>
                                            <option value="" disabled selected>Select Gender</option>
                                            <option value="Male">Male</option>
                                            <option value="Female">Female</option>
                                        </select>
                                    </div>

                                    <div class="input-box">
                                        <i class="fas fa-map-marker-alt"></i>
                                        <input type="text" name="address" placeholder="Address" required>
                                    </div>

                                    <div class="input-box">
                                        <i class="fas fa-id-card"></i>
                                        <input type="text" name="rollno" placeholder="Roll Number" required>
                                    </div>

                                    <div class="input-box">
                                        <i class="fas fa-fingerprint"></i>
                                        <input type="text" name="registration_no" placeholder="Registration No" required>
                                    </div>

                                    <div class="input-box">
                                        <i class="fas fa-graduation-cap"></i>
                                        <select name="student_class" required>
                                            <option value="" disabled selected>Select Class</option>
                                            <option value="+2">+2</option>
                                            <option value="+1">+1</option>
                                            <option value="10">10</option>
                                            <option value="9">9</option>
                                            <option value="8">8</option>
                                            <option value="7">7</option>
                                            <option value="6">6</option>
                                            <option value="5">5</option>
                                            <option value="4">4</option>
                                            <option value="3">3</option>
                                            <option value="2">2</option>
                                            <option value="1">1</option>
                                        </select>
                                    </div>

                                    <div class="input-box">
                                        <i class="fas fa-envelope"></i>
                                        <input type="email" name="email" placeholder="Email Address" required>
                                    </div>

                                    <div class="input-box">
                                        <i class="fas fa-lock"></i>
                                        <input type="password" name="password" placeholder="Create Password" required>
                                    </div>

                                    <button type="submit" class="button-64" style="margin-top: 20px; width: 100%;">
                                        <span class="text">Register</span>
                                    </button>

                                    <div class="text login-text">Already have an account? <a href="{{ url_for('student_login') }}">Login now</a></div>
                                </div>
                            </form>

                            {% if error %}
                            <div class="alert alert-danger" style="color: red; margin-top: 15px; text-align: center;">
                                {{ error }}
                            </div>
                            {% endif %}

                        </div>
                    </div>
                </div>
            </div>
        </div>

    </header>
</div>

<script src="{{url_for('static',filename='js/jquery.1.8.3.min.js')}}"></script>
<script src="{{url_for('static',filename='js/site.js')}}"></script>

</body>
</html>
